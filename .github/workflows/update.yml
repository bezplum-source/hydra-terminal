name: Aktualizacja danych Hydra Terminal

# Uruchamia sie co godzine (o minucie 7, nie 0 - zeby nie trafic w
# najbardziej zatloczony moment infrastruktury GitHub Actions) i pobiera
# nowe transakcje Swap z Uniswap V3, przelicza sygnal, commituje
# zaktualizowana strone z powrotem do repo, i publikuje ja na GitHub Pages.
#
# UWAGA: Netlify (dawniej podpiety jako "continuous deployment") zostal
# porzucony jako hosting - jego model rozliczen "credits" (od 2026: darmowy
# plan = 300 kredytow/miesiac, ~15 kredytow/deploy produkcyjny) nie ma
# szans pokryc cyklu co godzine (do ~720 deployow/miesiac). GitHub Pages
# jest darmowy i bez limitu liczby deployow - pasuje do tego cyklu.
# WYMAGA jednorazowej reczonej konfiguracji w repo (Settings -> Pages ->
# Build and deployment -> Source: "GitHub Actions") - bez tego krok
# "actions/deploy-pages" ponizej zwroci blad przy pierwszym uruchomieniu.
#
# "workflow_dispatch" pozwala odpalic to recznie z zakladki Actions w
# GitHub - przydatne przy pierwszym uruchomieniu, zeby nie czekac do
# najblizszej pelnej godziny.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hydra-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj zaleznosci
        run: pip install -r requirements.txt

      - name: Uruchom testy jednostkowe (nie commituj, jesli cos nie dziala)
        run: python -m pytest tests/ -q

      - name: Wyczysc ewentualne pozostalosci po testach
        # Zabezpieczenie dodane 2026-08-24 przy okazji naprawy analogicznego
        # problemu w "hyperliquid-update.yml": bug w izolacji jednego z
        # testow (naprawiony w tej samej dostawie) potrafil zostawic w
        # drzewie roboczym niezacommitowane zmiany w plikach data/*.json
        # (pisal do prawdziwych sciezek zamiast do tmp_path). Tutaj ponizszy
        # krok "run_incremental.py" i tak nadpisuje te pliki poprawnymi
        # danymi PRZED commitem, wiec to byla nieszkodliwa usterka - ale
        # ten krok to tania, dodatkowa warstwa bezpieczenstwa na wypadek
        # podobnego bledu izolacji w przyszlym tescie.
        run: git checkout -- .

      - name: Przywroc bufor transakcji Hyperliquid z cache (tylko odczyt)
        # NAPRAWA (Faza "bufor poza git", zgloszenie uzytkownika 2026-09-02:
        # "na stronie nic sie nie odswiezylo w zwiazku z hyperliquid - tyle
        # samo sledzonych portfeli, takie same decyzje good/bad", mimo ze
        # "hyperliquid-update.yml" przeszedl 7x w nocy bez bledu).
        #
        # PRZYCZYNA: data/hyperliquid_trades_buffer.jsonl przestal byc
        # sledzony przez git w tej samej fazie (patrz .gitignore) - dobre
        # dla "hyperliquid-update.yml" (ktory dostal wlasny krok
        # actions/cache/restore+save), ale ten workflow ("update.yml",
        # ktory faktycznie liczy composite_perp/klasyfikacje przez
        # run_incremental.py -> HyperliquidScoringEngine, patrz Faza H2)
        # NIE dostal ZADNEGO odpowiednika - jego "actions/checkout" po
        # prostu juz nie znajdowal tego pliku wsrod sledzonych, wiec
        # `load_hyperliquid_trades_buffer()` (defensywnie, patrz jej
        # docstring) cicho zwracal pusta liste PRZY KAZDYM URUCHOMIENIU -
        # HyperliquidScoringEngine.run() na pustej liscie nowych transakcji
        # nie aktualizuje EMA/stanu (ten sam mechanizm co "dust filter":
        # "jesli PO odsianiu dustu nie zostaje zadna transakcja w
        # new_trades, silnik zwraca None") - stad calkowicie zamrozone
        # liczby sledzonych/sklasyfikowanych portfeli perp, mimo ze
        # "hyperliquid-update.yml" naprawde zbieral nowe dane w tle.
        #
        # NAPRAWA: identyczny krok cache restore co w
        # "hyperliquid-update.yml" (ten sam "restore-keys" prefiks - cache
        # jest wspoldzielony miedzy wszystkimi workflow w tym repo, wiec
        # zawsze zlapie najnowszy wpis zapisany PRZEZ TAMTEN workflow).
        # Ten workflow NIE zapisuje wlasnego wpisu do cache (nigdy nie
        # modyfikuje tego pliku, tylko go czyta do klasyfikacji) - stad
        # tylko "restore", bez odpowiadajacego kroku "save".
        uses: actions/cache/restore@v4
        with:
          path: data/hyperliquid_trades_buffer.jsonl
          key: hyperliquid-buffer-v1-readonly-${{ github.run_id }}
          restore-keys: |
            hyperliquid-buffer-v1-

      - name: Pobierz nowe dane on-chain i przelicz sygnal
        env:
          ALCHEMY_RPC_URL: ${{ secrets.ALCHEMY_RPC_URL }}
        run: python live/run_incremental.py

      - name: Zacommituj zaktualizowane dane i strone
        run: |
          git config user.name "hydra-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ site/

          if git diff --cached --quiet; then
            echo "Brak zmian do zacommitowania."
            exit 0
          fi

          git commit -m "Automatyczna aktualizacja danych ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          # Jesli w miedzyczasie ktos recznie zmienil cos w repo (np. edycja
          # pliku przez przegladarke GitHub w tym samym momencie), zwykly
          # "git push" zostanie odrzucony ("! [rejected] ... fetch first"),
          # bo zdalna galaz "main" przesunela sie do przodu. Zamiast od razu
          # poddawac caly job, probujemy kilka razy: pobierz najnowszy stan,
          # przenies nasz commit na wierzch (rebase), sprobuj wyslac ponownie.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push udany (proba $i)."
              exit 0
            fi
            echo "Push nieudany (proba $i) - ktos inny zapisal zmiany w miedzyczasie. Probuje ponownie..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase nie powiodl sie (prawdziwy konflikt plikow) - przerywam."
              git rebase --abort || true
              exit 1
            fi
            sleep $((RANDOM % 8 + 3))
          done

          echo "Nie udalo sie zapisac zmian po kilku probach."
          exit 1

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5

      - name: Przygotuj artefakt strony (folder site/)
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Opublikuj na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
