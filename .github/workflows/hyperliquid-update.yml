name: Aktualizacja danych Hyperliquid ETH-PERP

# Faza H0 briefu Hyperliquid (patrz Projekt Claude, dokument
# "hydrav2-hyperliquid-brief.md") - OSOBNY workflow od "update.yml"
# (Uniswap/ETH), bo model wykonania jest inny: tamten to krotkie "zapytaj
# RPC i zgasn" (kilkanascie sekund), ten trzyma otwarte polaczenie
# WebSocket do Hyperliquid przez WIEKSZOSC godziny (Hyperliquid nie ma
# publicznego REST-owego "co sie stalo w ostatniej godzinie" - jedyny
# sposob zlapania firehose'u transakcji to trzymane polaczenie WS).
#
# Cron przesuniety wzgledem "update.yml" (minuta 20, nie 7) - zeby oba
# joby nie walczyly o runnery w tej samej minucie.
#
# Koszt: zero - repo jest publiczne, GitHub Actions na standardowych
# runnerach dla repo publicznych to bez limitu minut i bez oplat
# (zweryfikowane w changelogu cenowym GitHub z konca 2025 - to sie nie
# zmienia, zmieniaja sie tylko stawki dla repo prywatnych). GitHub Actions
# cache (uzywany ponizej) jest tak samo darmowy dla repo publicznych.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch: {}

# Faza "bufor poza git" (2026-09-01): ten workflow juz NIC nie commituje
# do repo (patrz krok cache ponizej) - "contents: write" nie jest juz
# potrzebne, wystarczy odczyt (checkout).
permissions:
  contents: read

concurrency:
  group: hydra-hyperliquid-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 55 minut nasluchu (HYPERLIQUID_LISTEN_SECONDS w listenerze, domyslnie
    # 50 minut) + zapas na checkout/install/cache - nastepne uruchomienie
    # (cron co godzine) i tak nie nadejdzie wczesniej.
    timeout-minutes: 58
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj zaleznosci
        run: pip install -r requirements.txt

      - name: Uruchom testy jednostkowe (nie startuj listenera, jesli cos nie dziala)
        run: python -m pytest tests/ -q

      - name: Wyczysc ewentualne pozostalosci po testach
        # Zabezpieczenie znalezione 2026-08-24: bug w izolacji jednego z
        # istniejacych testow (tests/test_live_incremental.py, naprawiony
        # w tej samej dostawie) potrafil zostawic w drzewie roboczym
        # niezacommitowane zmiany w niepowiazanych plikach danych. Ten
        # krok to dodatkowa warstwa bezpieczenstwa (poza samym fixem
        # testu), zeby listener zawsze startowal z czystego, sledzonego
        # przez git drzewa roboczego - niezaleznie od tego, ze ten
        # workflow (od Fazy "bufor poza git") juz nic sam nie commituje.
        run: git checkout -- .

      - name: Przywroc bufor transakcji z GitHub Actions cache
        # Faza "bufor poza git" (2026-09-01): data/hyperliquid_trades_buffer.jsonl
        # NIE jest juz sledzony przez git (patrz .gitignore) - przy 7-dniowym
        # oknie klasyfikacji (DEFAULT_BUFFER_LOOKBACK_HOURS = 168.0) wazylby
        # ~250-300MB+, co przekracza twardy limit GitHuba (100MB/blob) i
        # zablokowaloby "git push". Zamiast tego trzyma sie miedzy
        # uruchomieniami jako Actions cache (limit pojedynczego wpisu:
        # 10GB - nie problem nawet przy dalszym wzroscie). "restore-keys"
        # (prefiks bez ID runu) lapie NAJNOWSZY pasujacy wpis, bo klucz
        # zawsze zawiera unikalny numer runu (patrz krok zapisu na koncu) -
        # ten sam wzorzec co typowy "always save a new cache entry".
        uses: actions/cache/restore@v4
        with:
          path: data/hyperliquid_trades_buffer.jsonl
          key: hyperliquid-buffer-v1-${{ github.run_id }}
          restore-keys: |
            hyperliquid-buffer-v1-

      - name: Nasluchuj transakcje ETH-PERP na Hyperliquid (WebSocket, ~50 min)
        run: python live/hyperliquid_listener.py

      - name: Zapisz zaktualizowany bufor transakcji do cache
        # Zawsze zapisuje POD NOWYM kluczem (numer runu w kluczu gwarantuje
        # brak kolizji/pominiecia zapisu przez actions/cache) - nastepne
        # uruchomienie odnajdzie go przez "restore-keys" powyzej. Stare
        # wpisy wypadaja same (limit 10GB/repo -> wypieranie najstarszych,
        # plus naturalne wygasanie nieuzywanych po 7 dniach) - nic tu nie
        # trzeba recznie sprzatac.
        uses: actions/cache/save@v4
        with:
          path: data/hyperliquid_trades_buffer.jsonl
          key: hyperliquid-buffer-v1-${{ github.run_id }}
